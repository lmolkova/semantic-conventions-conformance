# Tooling config for the repo. Each component under tools/ is its own
# distribution with its own pyproject.toml; this file only carries the
# settings ruff and pyright apply repo-wide.

[tool.ruff]
target-version = "py310"
line-length = 79
output-format = "concise"
extend-exclude = ["scenarios/**/uv.lock"]

[tool.ruff.lint]
select = [
  "I",   # isort
  "F",   # pyflakes
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "PLC", # pylint convention
  "PLE", # pylint error
  "Q",   # flake8-quotes
  "A",   # flake8-builtins
  "TID", # flake8-tidy-imports
]
ignore = [
  "E501", # line-too-long
]

[tool.ruff.lint.per-file-ignores]
# Demo scenarios are read as documentation: long literal payloads and
# provider-shaped names matter more than lint rules there.
"scenarios/**" = ["A002", "E501"]
# The `reference` scenarios are copies of files maintained in
# semantic-conventions-genai under its own ruff config. Reformatting them here
# would only make the diff against upstream harder to read.
"scenarios/**/reference/**" = ["I001", "PLC0415"]

[tool.ruff.lint.isort]
detect-same-package = false
known-first-party = ["opentelemetry", "genai_conformance", "genai_mock_server"]
known-third-party = ["pytest"]

[tool.pyright]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
reportMissingTypeStubs = false
pythonVersion = "3.10"
# The typed tools. tools/mock-servers is deliberately out: its Flask handlers
# are plain untyped dicts shaped like provider payloads, and annotating them
# would say nothing the JSON literals next to them don't.
include = ["tools/runner/src", "tools/genai-runner/src"]
