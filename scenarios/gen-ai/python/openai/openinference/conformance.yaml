# DEMO — illustrates the layout only. Not a maintained conformance result, and
# nobody here maintains this instrumentation.
#
# Runs the same ../scenarios programs as the `opentelemetry` implementation
# next door, and the same set of them — this file and pyproject.toml are the
# entire difference between the two, which is what makes their data.json
# comparable.
#
# No span or metric expectations: this repo measures rather than tests. The
# violations below are declared because each one is a divergence someone has
# looked at and written a reason for.
instrumented_library: openai
instrumentation_library: openinference-instrumentation-openai

env:
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  # OpenInference emits `llm.*` / `input.*` of its own by default. This asks it
  # to emit gen_ai.* *alongside* those, which is what there is to check here.
  # It's the env-var form of TraceConfig(enable_genai_semconv=True), so the
  # shared scenario program stays free of any instrumentation-specific setup.
  OPENINFERENCE_ENABLE_GENAI_SEMCONV: "true"

scenarios:
  # `--project .` runs in this directory's own environment, which uv creates
  # and syncs from pyproject.toml — so this implementation never sees the
  # instrumentation the one next door installs.
  inference:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/inference.py

  tool_calling:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/tool_calling.py
