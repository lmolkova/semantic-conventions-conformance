# DEMO — illustrates the layout only. The scenarios come from
# opentelemetry-python-genai, which is where this instrumentation is *tested*.
#
# Nothing here asserts span counts or which metrics must appear. That is a
# test, and it belongs with the instrumentation; this repo measures — run the
# programs, record what came out in data.json, and report where it diverges
# from the conventions. `expected_violations` is the one thing worth
# declaring, because a divergence someone has looked at and written a reason
# for is a different fact from one nobody has seen yet.
#
# The programs live in ../scenarios and are shared with every other
# implementation under openai/; this file only says how to run them.
library: openai

env:
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY

scenarios:
  # `--project .` runs in this directory's own environment, which uv creates
  # and syncs from pyproject.toml. Zero-code instruments whatever it finds
  # installed, so an implementation sharing an environment with another would
  # report the other's spans as its own.
  inference:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/inference.py

  tool_calling:
    run: uv run --frozen --project . opentelemetry-instrument python ../scenarios/tool_calling.py
