runner: http-conformance
instrumented_library: undici
instrumentation_library: "@opentelemetry/instrumentation-undici"

expect:
  instrumentation_scope:
    schema_url:
      present: true
scenario_contract: ../../../../../../tools/http/test-client/contract.yaml

setup: otel-conformance-js install

# The mock server answers the same contract, so what this package measures is
# the sending; its base URL arrives as ${MOCK_SERVER_URL}.
server:
  run: http-mock-server --port ${PORT}

scenario_run: node ../client.js
