[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genai-conformance"
version = "0.1.0.dev0"
description = "Conformance runs against the OpenTelemetry GenAI semantic conventions."
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-conformance",
  "opentelemetry-genai-mock-server",
]

# What a `runner: genai-conformance` directory resolves to.
[project.entry-points.opentelemetry_conformance_runners]
genai-conformance = "genai_conformance:genai_session"

[project.scripts]
genai-conformance = "genai_conformance:cli"

# Neither sibling is on PyPI; install them editable from a checkout.
[tool.uv.sources]
opentelemetry-conformance = { path = "../../runner", editable = true }
opentelemetry-genai-mock-server = { path = "../mock-server", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/genai_conformance"]
