#
# Emits {signal -> {attribute -> requirement level}} for the registry, which
# the coverage reduction diffs against what a run emitted to report which
# declared attributes are covered.
#
# Provider refinements (openai.inference.client refines gen_ai.inference.client)
# are merged into the signal they refine, the refinement winning when it
# restates an attribute at a stricter level.
templates:
  - template: "coverage-model.json.j2"
    application_mode: single
    filter: |
      def level:
        if type == "string" then .
        elif type == "object" then (keys[0])
        # Weaver omits the level for attributes that take the default.
        else "recommended" end;

      def attributes:
        [.attributes[]? | {key: .key, value: (.requirement_level | level)}]
        | from_entries;

      # A signal's own definition has id == the name it declares; its
      # refinements are named after it and sort after it.
      def merged($name):
        reduce (sort_by(.id != $name))[] as $signal ({};
          . + ($signal | attributes));

      {
        spans: (.refinements.spans | group_by(.type) | map({
          key: .[0].type,
          value: {kind: .[0].kind, attributes: merged(.[0].type)},
        }) | from_entries),
        events: (.refinements.events | group_by(.name) | map({
          key: .[0].name,
          value: {attributes: merged(.[0].name)},
        }) | from_entries),
        metrics: (.refinements.metrics | group_by(.name) | map({
          key: .[0].name,
          value: {attributes: merged(.[0].name)},
        }) | from_entries),
      }
